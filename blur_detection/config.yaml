# ==========================================
# Blur Detection Batch Processor Configuration
# ==========================================

# The default directory path where the raw input images are located.
# This populates the initial text box in the Streamlit UI.
default_input: "/home/vilota/566-qa-2/621D/IMG"

# The final width and height (in pixels) of the cropped image fed into the classifier.
# WARNING: Do NOT modify this size. The DINOv3 classifier head was explicitly trained 
# on this exact dimension. Changing it will break the model's predictions.
target_size: [200, 200]

# Adjusts the starting anchor of the crop window for specific grid positions. 
# Format is [dx, dy]:
# dx: Negative shifts the crop left, positive shifts right.
# dy: Negative shifts the crop up, positive shifts down.
position_shifts:
  1: [-50, 0]
  3: [-50, 0]
  5: [-50, 0]
  7: [-50, 0]
  9: [-50, 0]

# The total number of classification categories the model was trained on.
num_classes: 4

# ==========================================
# STRICTLY FOR REFERENCE ONLY - DO NOT MODIFY
# ==========================================
# The application hardcodes these class mappings for safety. Changing them here will do nothing.
# id_to_label:
#   0: 'f'  (Fail)
#   1: 'o'  (OK)
#   2: 'sn' (Slightly Noisy/Blurry)
#   3: 'n'  (Noisy)

# The minimum probability (0.0 to 1.0) required for the model to confidently pass an image as 'o' (OK).
# If the 'o' probability is below this gate, the image is flagged for review based on the next highest defect class.
confidence_gate: 0.9

# The specific grid cell positions (1-9) the processor should look for and evaluate.
target_positions: [1, 3, 5, 7, 9]


# ==========================================
# Output File Names
# ==========================================
# These files will be saved inside the "Output folder" directory you select in the Streamlit UI.

# Contains the raw predictions and confidence scores for every single image processed in the batch.
output_csv: "consolidated_batch_predictions.csv"
output_excel: "consolidated_batch_predictions.xlsx"

# Contains ONLY the specific Serial Numbers (SNs) flagged for review based on the filtering rules below.
filtered_csv: "predictions_filtered.csv"
filtered_excel: "predictions_filtered.xlsx"


# ==========================================
# Advanced Review Filtering Thresholds
# ==========================================
# Note: Any SN containing at least one 'n' (Noisy) prediction is automatically flagged.
# The thresholds below determine how 'sn' (Slightly Noisy) predictions are handled.

# 1. Single Threshold: 
# If ANY single position is predicted as 'sn' with a confidence greater than or equal to this percentage, 
# the entire Serial Number (SN) is flagged for review.
sn_single_threshold_percent: 45

# 2. Multiple Count Threshold (Optional):
# If a specific number of positions (sn_count_required) are predicted as 'sn', 
# AND each of those predictions meets this confidence percentage (sn_count_threshold_percent), 
# the SN is flagged for review. 
# (If you delete these two lines, the application will safely ignore them and only use the Single Threshold).
# sn_count_threshold_percent: 40
# sn_count_required: 3