name: blur_detection
channels:
  - conda-forge
  - defaults
dependencies:
  # Base Python
  - python=3.11
  - pip
  
  # Core Conda Packages
  - numpy >=1.26,<2
  - pandas
  - pillow
  - pyyaml
  - openpyxl
  - streamlit
  - scikit-learn
  - seaborn
  - matplotlib
  - omegaconf
  - scipy
  - scikit-image

  # Pip Packages
  - pip:
      # PULL PYTORCH NIGHTLY (CUDA 12.8 / sm_120) DIRECTLY VIA PIP
      - --extra-index-url https://download.pytorch.org/whl/nightly/cu124
      - torch
      - torchvision
      - torchaudio
      
      # Standard Pip Packages
      - opencv-python
      - einops
      - pycocotools
      - psutil
      - streamlit-keyup
      
      # DINOv3 Pip Dependencies
      - scikit-learn-intelex
      - submitit
      - termcolor
      - torchmetrics
      - wandb
      
      # SAM3 Core Pip Dependencies
      - ftfy==6.1.1
      - regex
      - iopath>=0.1.10
      - timm>=1.0.17
      - tqdm
      - typing_extensions
      - huggingface_hub
      - certifi==2020.12.5
      - PyWavelets>=1.4.1
      
      # SAM3 Extended/Training Dependencies
      - hydra-core
      - tensorboard
      - zstandard
      - fvcore
      - fairscale
      - decord